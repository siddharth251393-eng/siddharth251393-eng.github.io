[build]
  command = "python3 scripts/build_site.py"
  publish = "dist"

[build.environment]
  # Deploy previews stay noindex. Production is explicitly enabled below.
  PUBLIC_INDEXING = "false"
  GSC_VERIFICATION = "koT_gD3gZGj46unVdvPKvEpG-xzsSRtiJCWK4tKOZW4"
  # Add GA_MEASUREMENT_ID and/or CLARITY_PROJECT_ID in Netlify only after the projects are created.
  # The build loads optional tracking tags behind the visitor consent panel.

[context.production.environment]
  # The approved, sourced WPI analysis is ready for publication on the free Netlify address.
  # Update the canonical origin and Search Console property when a custom domain is purchased.
  PUBLIC_INDEXING = "true"
