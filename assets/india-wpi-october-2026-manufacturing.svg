<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Two manufacturing measures moved in different directions</title>
  <desc id="desc">From September to October 2026, Manufactured Products wholesale inflation eased from 9.76 to 9.54 percent year on year. The trial manufacturing Input Producer Price Index rose from 106.1 to 108.2 index points. Both October readings are provisional; these are different measures and cannot be directly compared.</desc>
  <rect width="1200" height="675" fill="#102333"/>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="48" width="8" height="68" rx="4" fill="#52b4bd"/>
    <text x="94" y="74" fill="#b7dce1" font-size="16" font-weight="700" letter-spacing="2.5">INDUSTRYWIRE  /  MANUFACTURING</text>
    <text x="94" y="130" fill="#ffffff" font-size="38" font-weight="700">Two factory measures. Different directions.</text>
    <text x="94" y="165" fill="#bad0d6" font-size="18">Both from the October release · September → October</text>
    <rect x="64" y="204" width="518" height="278" rx="16" fill="#183b4d" stroke="#31586a" stroke-width="2"/>
    <rect x="618" y="204" width="518" height="278" rx="16" fill="#183b4d" stroke="#31586a" stroke-width="2"/>
    <g fill="none" stroke="#d4e5e8" stroke-width="3" stroke-linejoin="round">
      <path d="M101 289h50v-30l30 18v-35h38v47h27v48H101z"/><path d="M151 289v-27h30v17m38-37v13h15"/>
      <path d="M650 342v-31l28 16v-25l30 17v-47h28v70h24v15H650z"/><path d="M662 342v-18h12v18m22 0v-18h12v18m22-48h9v12h-9z"/>
    </g>
    <g fill="#72c6c8"><rect x="157" y="308" width="12" height="16"/><rect x="180" y="308" width="12" height="16"/><rect x="203" y="308" width="12" height="16"/><circle cx="733" cy="266" r="5"/><circle cx="745" cy="250" r="4"/><circle cx="756" cy="238" r="3"/></g>
    <text x="274" y="252" fill="#a9c7d0" font-size="15" font-weight="700" letter-spacing="1">OUTPUT PRICES</text>
    <text x="274" y="289" fill="#ffffff" font-size="20" font-weight="700">Manufactured Products WPI</text>
    <text x="274" y="345" fill="#ffffff" font-size="34" font-weight="700">9.76% <tspan fill="#72c6c8">→</tspan> 9.54%</text>
    <text x="274" y="377" fill="#72c6c8" font-size="16" font-weight="700">−0.22 pp · year on year</text>
    <text x="274" y="421" fill="#bdcfd4" font-size="15">October rate eased slightly.</text>

    <text x="846" y="252" fill="#f2c878" font-size="15" font-weight="700" letter-spacing="1">INPUT PRICES · TRIAL PPI</text>
    <text x="846" y="289" fill="#ffffff" font-size="20" font-weight="700">Manufacturing Input PPI</text>
    <text x="846" y="345" fill="#ffffff" font-size="34" font-weight="700">106.1 <tspan fill="#f2c878">→</tspan> 108.2</text>
    <text x="846" y="377" fill="#f2c878" font-size="15" font-weight="700">+2.1 index points · monthly level</text>
    <text x="846" y="421" fill="#bdcfd4" font-size="15">October reading is provisional.</text>

    <rect x="64" y="508" width="1072" height="86" rx="12" fill="#2a3942" stroke="#775f3b" stroke-width="1.5"/>
    <text x="88" y="541" fill="#f2c878" font-size="15" font-weight="700" letter-spacing="1">READ WITH CARE</text>
    <text x="88" y="570" fill="#ffffff" font-size="17">Different units and definitions: these figures cannot be directly compared or used to infer a company's costs or margins.</text>
    <text x="64" y="625" fill="#d4e1e5" font-size="15">October readings are provisional. Source: Ministry of Commerce &amp; Industry, 16 Nov 2026 · IndustryWire visualization</text>
  </g>
</svg>
